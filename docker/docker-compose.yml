version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doviz-postgres
    environment:
      POSTGRES_USER: doviz
      POSTGRES_PASSWORD: doviz_secret
      POSTGRES_DB: doviz_db
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doviz -d doviz_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: doviz-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://doviz:doviz_secret@postgres:5432/doviz_db?schema=public
      API_PORT: 4000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGINS: "*"
    ports:
      - '4000:4000'
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: doviz-web
    depends_on:
      - api
    ports:
      - '5173:80'
    restart: unless-stopped

volumes:
  pgdata: